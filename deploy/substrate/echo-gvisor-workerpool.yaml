# Stateless-tier WorkerPool on gVisor, for hosts without KVM (for example an arm64 Mac running kind).
#
# Run the suite with ECHO_SANDBOX_CLASS=gvisor to point the echo template at this pool instead of the
# micro-VM one (echo-microvm-workerpool.yaml). CI runs the micro-VM pool, so both tiers exercise the
# same isolation class.
#
# workerImage is a ko:// import path that the WorkerPool controller passes to its Pods unchanged:
# build ateworker-gvisor with ko and substitute its digest before applying (see the no-KVM recipe in
# docs/substrate-conformance.md).
#
# The `workload` label is repo-scoped on purpose: worker eligibility ignores namespaces and matches
# labels across every pool in the cluster, so a label shared with a substrate demo pool would let the
# scheduler place our actor there.

apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: echo-gvisor
  namespace: ate-agentsessions
  labels:
    workload: agentsessions-echo-gvisor
spec:
  # One worker for the template's golden-snapshot build and one per concurrently running actor.
  replicas: 3
  sandboxClasses:
    - name: gvisor
  workerImage: ko://go.ate.dev/substrate/cmd/ateworker-gvisor
  template:
    # The worker advertises these limits as its scheduling capacity, and the ate-api scheduler books
    # each ActorTemplate's spec.resources against it: the suite's templates ask for 1000m and 512Mi,
    # so each worker holds one actor. Requests stay low so the pool fits on a single kind node next
    # to ate-system.
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
