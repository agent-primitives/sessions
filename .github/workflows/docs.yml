name: docs

# Deliberately has no paths filter. On a markdown-only change, ci's and substrate-e2e's required
# jobs report success without running their steps, which is what makes a prose pull request fast,
# but it would leave those pull requests with nothing that verifies the README. This runs
# everywhere; the links job takes seconds, go-blocks as long as compiling the module.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: relative links and heading anchors resolve
        run: python3 hack/check-doc-links.py

  # Go blocks in the docs are type-checked against the current module. It runs here rather than in ci
  # because ci skips markdown-only pull requests, which are the ones most likely to change a block;
  # this workflow runs on every pull request, so an API change that breaks a block fails here too.
  go-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go blocks in Markdown type-check
        run: go run ./hack/doccheck
