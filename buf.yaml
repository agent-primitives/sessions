version: v2
modules:
  - path: api
lint:
  use:
    - MINIMAL
  except:
    # Deliberate flat layout: the protos live at the module root (api/) with package
    # agentsessions.v1 and generate to api/genpb. Enforcing the directory-matches-package rule
    # would require api/agentsessions/v1/, which changes the generated Go import path.
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
  except:
    # The Go module moved from github.com/aramase/agentsessions to
    # github.com/agent-primitives/sessions, so go_package changed with it. The proto package,
    # names and field numbers did not; every wire rule in FILE still applies. Remove this once
    # v0.2.0 is tagged and the baseline carries the new go_package.
    - FILE_SAME_GO_PACKAGE
