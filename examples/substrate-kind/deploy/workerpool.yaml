apiVersion: v1
kind: Namespace
metadata:
  name: sessions-example
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: chat-harness
  namespace: sessions-example
  labels:
    workload: sessions-example-SANDBOX_CLASS
spec:
  replicas: 2
  sandboxClasses:
    - name: SANDBOX_CLASS
  workerImage: WORKER_IMAGE
  template:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
