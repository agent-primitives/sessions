# Everything the demo runs in Kubernetes: the gVisor WorkerPool, the fake model and agentsessionsd.
# agentsessionsd calls the ate-api from here, and substrate v0.6.0 admits ate-api-server only from
# namespaces labeled ate.dev/api-access=true, worker pods excluded (agent-substrate
# manifests/ate-install/ate-system-networkpolicies.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: agentsuite-demo
  labels:
    ate.dev/api-access: "true"
---
# Both agentsessionsd tiers run as this ServiceAccount; up.sh grants it editor on the agentsuite-demo
# atespace through the atespace's AccessPolicy, and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentsessionsd
  namespace: agentsuite-demo
