# agentsessionsd, substrate build (integrations/substrate/cmd/agentsessionsd). up.sh renders it twice,
# as agentsessionsd (the stateless tier) and agentsessionsd-memory (the memory tier). It journals to an
# emptyDir: the demo's journal lives as long as this pod.
#
# It reaches the ate-api with the pod's projected ServiceAccount token and verifies the ate-api's
# serving certificate against the cluster's servicedns ClusterTrustBundle, and reaches the agent's
# actors through the atenet-router over mTLS. Its client certificate is the pod's SVID,
# spiffe://cluster.local/ns/agentsuite-demo/sa/agentsessionsd, which up.sh allowlists on the
# router. Model calls go to MODEL_BASE_URL, the in-cluster fake model by default; the optional key
# comes from the agentsessionsd-model Secret, never from the manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: DAEMON_NAME
  namespace: agentsuite-demo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: DAEMON_NAME}
  template:
    metadata:
      labels: {app: DAEMON_NAME}
      annotations:
        # The MODEL_API_KEY env var is read at container start. up.sh stamps the Secret's
        # resourceVersion here, so a rotated or deleted key restarts the pod.
        agentsuite-demo/model-secret-version: "MODEL_SECRET_VERSION"
    spec:
      serviceAccountName: agentsessionsd
      containers:
        - name: agentsessionsd
          image: DAEMON_IMAGE
          args:
            - -addr=:8080
            - -journal=/data/agentsessions.db
            - -model=MODEL_ID
            - -model-base-url=MODEL_BASE_URL
            - -model-path=MODEL_PATH
            - -model-auth-header=MODEL_AUTH_HEADER
            - SUBSTRATE_HARNESS_FLAG
            - -substrate-atespace=agentsuite-demo
            - -ateapi-addr=api.ate-system.svc:443
            - -ateapi-server-name=api.ate-system.svc
            - -ateapi-ca-file=/var/run/ate/ca/ca.pem
            - -ateapi-token-file=/var/run/ate/token/token
            - -atenet-router=atenet-router.ate-system.svc:443
            - -atenet-router-cert-file=/var/run/ate/router-client/credential-bundle.pem
            - -atenet-router-ca-file=/var/run/ate/router-client/router-ca.pem
          env:
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef: {name: agentsessionsd-model, key: api-key, optional: true}
          ports: [{containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: 8080}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: ate-token, mountPath: /var/run/ate/token, readOnly: true}
            - {name: ate-ca, mountPath: /var/run/ate/ca, readOnly: true}
            - {name: router-client, mountPath: /var/run/ate/router-client, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken: {audience: api.ate-system.svc, expirationSeconds: 3600, path: token}
        - name: ate-ca
          projected:
            sources:
              - clusterTrustBundle: {name: "servicedns.podcert.ate.dev:identity:primary-bundle", path: ca.pem}
        # kubelet issues and rotates the pod's SVID; the router CA follows the live servicedns
        # bundle by label, so a CA rotation is picked up. agentsessionsd re-reads both per
        # connection.
        - name: router-client
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels: {podcert.ate.dev/canarying: live}
                  path: router-ca.pem
---
apiVersion: v1
kind: Service
metadata:
  name: DAEMON_NAME
  namespace: agentsuite-demo
spec:
  selector: {app: DAEMON_NAME}
  ports: [{port: 8080, targetPort: 8080}]
