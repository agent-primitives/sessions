# Stateless-tier WorkerPool: micro-VM (kata + cloud-hypervisor) workers for the echo harness. Both
# tiers default to the micro-VM class so the suite covers the micro-VM path end to end. On a host
# without KVM, use echo-gvisor-workerpool.yaml with ECHO_SANDBOX_CLASS=gvisor instead.
#
# Only the pool is a Kubernetes object. The ActorTemplate is a substrate API resource that lives in an
# atespace, so the conformance suite creates it through Control (integrations/substrate/e2e/
# templates_test.go) with the harness image under test. The pool names the `microvm` class without a
# configRef, so it resolves to the class default: the cluster-scoped `microvm` SandboxConfig that
# substrate's hack/install-microvm-deps.sh --install installs along with the assets it stages
# (run-microvm-demo-kind.sh calls the same script).
#
# The `workload` label is repo-scoped on purpose: worker eligibility is the sandbox class plus a label
# selector matched over every worker in the cluster with no namespace filter, and
# run-microvm-demo-kind.sh installs its own micro-VM pool. Keep this label unique to this repo.

apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: echo-microvm
  namespace: ate-agentsessions
  labels:
    workload: agentsessions-echo-microvm
spec:
  # One worker for the template's golden-snapshot build and one per concurrently running actor.
  replicas: 3
  sandboxClasses:
    - name: microvm
  workerImage: ko://go.ate.dev/substrate/cmd/ateworker-microvm
  template:
    # The worker advertises these limits as its scheduling capacity, and the ate-api scheduler books
    # each ActorTemplate's spec.resources against it: the suite's templates ask for 1000m and 512Mi
    # (integrations/substrate/e2e/templates_test.go), so each worker holds one actor. A worker with
    # no limits advertises none and admits no sized actor. The micro-VM is sized by the template,
    # not by these. Requests stay low so every pool fits on a single kind node next to ate-system.
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
