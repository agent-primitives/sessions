apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelstub
  namespace: sessions-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modelstub
  template:
    metadata:
      labels:
        app: modelstub
    spec:
      automountServiceAccountToken: false
      containers:
        - name: modelstub
          image: MODELSTUB_IMAGE
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: modelstub
  namespace: sessions-example
spec:
  selector:
    app: modelstub
  ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sessions-to-modelstub
  namespace: sessions-example
spec:
  podSelector:
    matchLabels:
      app: modelstub
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agentsessions
      ports:
        - protocol: TCP
          port: 8080
