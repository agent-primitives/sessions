# agentsessionsd for the coordinator suite (examples/agentsuite-substrate/cmd/agentsessionsd: the
# substrate build plus the AgentSuite invocation executor). demo/coordinator.sh renders it. One
# daemon serves the three agents as substrate harnesses, each creating its session actors in its own
# atespace (,actors=), and AGENTSUITE_INVOKES carries the suite's invokes edges and the deployment's
# approval choice. It journals to an emptyDir: the journal lives as long as this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentsessionsd-coordinator
  namespace: agentsuite-demo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: agentsessionsd-coordinator}
  template:
    metadata:
      labels: {app: agentsessionsd-coordinator}
      annotations:
        agentsuite-demo/model-secret-version: "MODEL_SECRET_VERSION"
    spec:
      containers:
        - name: agentsessionsd
          image: DAEMON_IMAGE
          args:
            - -addr=:8080
            - -journal=/data/agentsessions.db
            - -model=MODEL_ID
            - -model-base-url=MODEL_BASE_URL
            - -model-path=MODEL_PATH
            - -model-auth-header=MODEL_AUTH_HEADER
            - COORDINATOR_FLAG
            - WRITER_FLAG
            - REVIEWER_FLAG
            - -ateapi-addr=api.ate-system.svc:443
            - -ateapi-server-name=api.ate-system.svc
            - -ateapi-ca-file=/var/run/ate/ca/ca.pem
            - -ateapi-token-file=/var/run/ate/token/token
            - -atenet-router=atenet-router.ate-system.svc:80
          env:
            - name: AGENTSUITE_INVOKES
              value: "INVOKES_VALUE"
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef: {name: agentsessionsd-model, key: api-key, optional: true}
          ports: [{containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: 8080}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: ate-token, mountPath: /var/run/ate/token, readOnly: true}
            - {name: ate-ca, mountPath: /var/run/ate/ca, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken: {audience: api.ate-system.svc, expirationSeconds: 3600, path: token}
        - name: ate-ca
          projected:
            sources:
              - clusterTrustBundle: {name: "servicedns.podcert.ate.dev:identity:primary-bundle", path: ca.pem}
---
apiVersion: v1
kind: Service
metadata:
  name: agentsessionsd-coordinator
  namespace: agentsuite-demo
spec:
  selector: {app: agentsessionsd-coordinator}
  ports: [{port: 8080, targetPort: 8080}]
