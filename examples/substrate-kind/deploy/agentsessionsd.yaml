apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentsessions
  namespace: sessions-example
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sessions-example-journal
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: sessions-example-local
  hostPath:
    path: /var/lib/sessions-example
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: journal
  namespace: sessions-example
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sessions-example-local
  volumeName: sessions-example-journal
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentsessions
  namespace: sessions-example
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentsessions
  template:
    metadata:
      labels:
        app: agentsessions
      annotations:
        sessions-example/model-config-version: "MODEL_CONFIG_VERSION"
        sessions-example/model-secret-version: "MODEL_SECRET_VERSION"
    spec:
      serviceAccountName: agentsessions
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: journal-permissions
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -c
            - "chown -R 65532:65532 /data"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: journal
              mountPath: /data
      containers:
        - name: agentsessionsd
          image: DAEMON_IMAGE
          args:
            - --addr=:8080
            - --journal=/data/agentsessions.db
            - --project=$(PROJECT)
            - --model=$(MODEL_NAME)
            - --model-base-url=$(MODEL_BASE_URL)
            - --model-path=$(MODEL_PATH)
            - --model-auth-header=$(MODEL_AUTH_HEADER)
            - --substrate-atespace=sessions-example
            - --substrate-harness=substrate-chat=sessions-example/ACTOR_TEMPLATE
            - --ateapi-addr=api.ate-system.svc:443
            - --ateapi-server-name=api.ate-system.svc
            - --ateapi-token-file=/var/run/ate/token/token
            - --ateapi-ca-file=/var/run/ate/ca/ca.pem
            - --atenet-router=atenet-router.ate-system.svc:80
          envFrom:
            - configMapRef:
                name: model
            - secretRef:
                name: model
                optional: true
          ports:
            - name: grpc
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: journal
              mountPath: /data
            - name: ate-token
              mountPath: /var/run/ate/token
              readOnly: true
            - name: ate-ca
              mountPath: /var/run/ate/ca
              readOnly: true
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: journal
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
                  path: token
        - name: ate-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: ca.pem
---
apiVersion: v1
kind: Service
metadata:
  name: agentsessions
  namespace: sessions-example
spec:
  selector:
    app: agentsessions
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
---
# The documented access path is kubectl port-forward, not pod-network ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-sessions-ingress
  namespace: sessions-example
spec:
  podSelector:
    matchLabels:
      app: agentsessions
  policyTypes:
    - Ingress
  ingress: []
