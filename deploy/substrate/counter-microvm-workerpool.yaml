# Stateful-tier WorkerPool: micro-VM (kata + cloud-hypervisor) workers for the in-RAM counter harness,
# the REQUIRES_MEMORY_SNAPSHOT path a plain pod cannot provide.
#
# The ActorTemplate is created by the conformance suite through Control (templates_test.go). The
# pool names the `microvm` class without a configRef, so it resolves to the class default: the
# cluster-scoped `microvm` SandboxConfig that substrate's hack/install-microvm-deps.sh --install
# installs along with the assets it stages (run-microvm-demo-kind.sh calls the same script).
# TODO(microvm): a dedicated agentsessions SandboxConfig referencing the same staged assets, so this
# does not depend on substrate's installer creating one.
#
# The `workload` label is deliberately NOT the demo's: worker eligibility is the sandbox class plus a label
# selector matched over every worker in the cluster with no namespace filter, and
# run-microvm-demo-kind.sh installs its own micro-VM pool. Keep this label unique to this repo.

apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: counter-microvm
  namespace: ate-agentsessions
  labels:
    workload: agentsessions-counter-microvm
spec:
  # A running actor claims a worker exclusively. The fork fan-out is the peak: the parent is
  # checkpointed (worker freed) and `children` clones run at once, plus the golden build and a
  # previous test's actor whose worker has not been released yet.
  # integrations/substrate/e2e/fork_test.go forks 3, so 6 leaves headroom.
  replicas: 6
  sandboxClasses:
    - name: microvm
  workerImage: ko://go.ate.dev/substrate/cmd/ateworker-microvm
  template:
    # The worker advertises these limits as its scheduling capacity, and the ate-api scheduler books
    # each ActorTemplate's spec.resources against it: the suite's templates ask for 1000m and 512Mi
    # (integrations/substrate/e2e/templates_test.go), so each worker holds one actor. A worker with
    # no limits advertises none and admits no sized actor. The micro-VM is sized by the template,
    # not by these. Requests stay low so every pool fits on a single kind node next to ate-system.
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
